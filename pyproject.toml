[project]
name = "pdfcracker"
version = "0.1.0"
description = "Adaptive PDF-to-Markdown extraction and visual calibration workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pdftext>=0.7.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
pdfcracker = "pdfcracker:main"

[project.optional-dependencies]
diagnostics = []

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
